# Mouse and keyboard setup
input {
    # Define keyboard layout and behaviour

    # at-translated-* {
    #   # kb_layout = fr
    #   kb_model =
    # }

    kb_options = compose:sclk   # Use Sroll Lock as compose for special diacritics

    # NumLock off on start is so dumb
    numlock_by_default = yes

    # Make window focus follow the mouse around
    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }

    # -1.0 - 1.0, 0 means no modification.
    sensitivity = 0
}

device {
  name = cherry-gmbh-cherry-corded-device
  kb_layout = gb
  kb_variant = extd
}

device {
  name = cherry-gmbh-cherry-corded-device-1
  kb_layout = gb
  kb_variant = extd
}

device {
  name = at-translated-set-2-keyboard
  kb_layout = fr
  kb_model = thinkpad
}

device {
  name = thinkpad-extra-buttons
  kb_layout = fr
  kb_model = thinkpad
}

device {
  name = video-bus
  kb_layout = fr
  kb_model = thinkpad
}

device {
  name = sleep-button
  kb_layout = fr
  kb_model = thinkpad
}

device {
  name = power-button
  kb_layout = fr
  kb_model = thinkpad
}


# Monitors
# ______| Name     | Resolution@Hz | Position | Scale
monitor = HDMI-A-1 , highres       , 0x0      , 1
monitor = eDP-1    , highres       , auto     , 1
